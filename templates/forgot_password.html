<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ school_name }} - Forgot Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <form class="card" method="POST" action="{{ url_for('forgot_password') }}">
    <div class="seal"><img src="{{ url_for('static', filename='logo.jpg') }}" alt="{{ school_initials }}"></div>
    <h1>Forgot Password</h1>
    <p class="sub">Confirm your details to reset your password</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="field">
      <label for="studentId">Student ID / Matric Number</label>
      <input type="text" id="studentId" name="studentId" placeholder="e.g. U/22/CS/1042" required>
    </div>

    <div class="field">
      <label for="phoneNumber">Phone Number</label>
      <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="e.g. 08012345678" required>
    </div>

    <button type="submit" class="submit">Continue</button>

    <p class="footer-note" style="margin-top:20px;"><a href="{{ url_for('login') }}">Back to sign in</a></p>
  </form>
</body>
</html>
