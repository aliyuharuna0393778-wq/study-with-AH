<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ school_name }} - Reset Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <form class="card" method="POST" action="{{ url_for('reset_password') }}">
    <div class="seal"><img src="{{ url_for('static', filename='logo.jpg') }}" alt="{{ school_initials }}"></div>
    <h1>Set New Password</h1>
    <p class="sub">Choose a new password for your account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="field">
      <label for="password">New Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
      </div>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <div class="password-wrap">
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required>
        <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">👁️</button>
      </div>
    </div>

    <button type="submit" class="submit">Update Password</button>
  </form>

<script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}
</script>
</body>
</html>
