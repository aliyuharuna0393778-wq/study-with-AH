<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ school_name }} - Register</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <form class="card" method="POST" action="{{ url_for('register') }}">
    <div class="seal"><img src="{{ url_for('static', filename='logo.jpg') }}" alt="{{ school_initials }}"></div>
    <h1>Create Account</h1>
    <p class="sub">Register with your university details</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="field">
      <label for="studentId">Student ID / Matric Number</label>
      <input type="text" id="studentId" name="studentId" placeholder="e.g. U/22/CS/1042"
             value="{{ form.studentId or '' }}" required>
    </div>

    <div class="field">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" placeholder="Your full name"
             value="{{ form.fullName or '' }}" required>
    </div>

    <div class="field">
      <label for="phoneNumber">Phone Number</label>
      <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="e.g. 08012345678"
             value="{{ form.phoneNumber or '' }}" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
        <button type="button" class="toggle-password" onclick="togglePassword('password', this)">👁️</button>
      </div>
    </div>

    <button type="submit" class="submit">Create Account</button>

    <div class="divider">Already registered</div>
    <p class="footer-note"><a href="{{ url_for('login') }}">Sign in to your account</a></p>
  </form>
  <div class="site-credit">Developed by Aliyu Bn Haroon</div>
<script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}
</script>
</body>
</html>
