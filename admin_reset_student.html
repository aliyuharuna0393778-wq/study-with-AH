<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ school_name }} - Reset Student Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <form class="card" method="POST">
    <div class="seal"><img src="{{ url_for('static', filename='logo.jpg') }}" alt="{{ school_initials }}"></div>
    <h1>Reset Password</h1>
    <p class="sub">{{ student.full_name }} — {{ student.student_id }}</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="field">
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
    </div>

    <button type="submit" class="submit">Set New Password</button>

    <p class="footer-note" style="margin-top:20px;"><a href="{{ url_for('admin_students') }}">Back to students</a></p>
  </form>
</body>
</html>
